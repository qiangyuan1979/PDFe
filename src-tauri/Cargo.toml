[package]
name = "pdfe"
version = "0.2.0"
description = "PDFe - 现代化 Windows PDF 编辑器"
authors = ["konny_yuan"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to only be an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pdfe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：允许 webview 通过 asset:// 协议读取本地文件（水印添加面板回显所选图片预览）。
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdfium-render = { version = "0.8", features = ["thread_safe"] }
image = "0.25"
thiserror = "2"
tauri-plugin-dialog = "2.7.3"

# P4：pdfium-render 只能读取加密状态、不能写入加密（save_to_writer 里硬编码 flags = 0）。
# 因此加密导出走：pdfium save_to_bytes（明文）→ lopdf 载入 → EncryptionState → 重序列化。
lopdf = "0.45"

# v2 原生阅读非 PDF 文档：
# - 编码探测（中文 txt / 源码常见 GBK 系编码，按 UTF-8 直读会整篇乱码）
encoding_rs = "0.8"
chardetng = "0.1"
# - markdown → HTML
pulldown-cmark = "0.12"
# - EPUB 解包（只留 deflate，EPUB 规范只要求这一种压缩）
zip = { version = "2", default-features = false, features = ["deflate"] }
# - EPUB 内图片内联成 data URL
base64 = "0.22"

# 可选 feature：启用后引入 Tesseract OCR 引擎。
# 注意：构建时需要 cmake + 系统已安装 libtesseract-dev / tesseract-ocr-devel。
# 默认关闭，普通用户 cargo build 不受影响。
tesseract = { version = "0.15", optional = true }

[features]
# 默认无 OCR。启用方法：cargo build --features ocr
default = []
ocr = ["dep:tesseract"]
# 生产构建必须显式启用：tauri-macros 用 cfg!(not(feature = "custom-protocol")) 推导 dev 开关，
# 缺失该 feature 会让 release 包仍按 dev 处理——只连 build.devUrl、内嵌资源为空，脱离 dev server 即白屏。
# 注意 default 里不能加它，否则 `npm run tauri dev` 会改走自定义协议、丢失 devUrl 热更新。
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# 用于生成带 AcroForm 字段的测试 PDF fixture（和 perf.rs 自动生成 large_*.pdf 同模式）
printpdf = { version = "0.7", default-features = false, features = ["embedded_images"] }

# 命令层集成测试（tests/commands.rs）需要 tauri::test（mock 运行时）。
# 该模块被 #[cfg(any(test, feature = "test"))] 门控，外部 crate 的集成测试必须显式开启 test feature。
tauri = { version = "2", features = ["test"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
